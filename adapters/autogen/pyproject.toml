[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgit-autogen"
version = "0.1.0"
description = "AgentGit adapter for AutoGen"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "agentgit-adapter>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentgit_autogen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:langsmith_plugin"
