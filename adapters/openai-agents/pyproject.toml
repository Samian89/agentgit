[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgit-openai-agents"
version = "0.1.0"
description = "AgentGit adapter for the OpenAI Agents SDK"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentgit_openai_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:langsmith_plugin"
